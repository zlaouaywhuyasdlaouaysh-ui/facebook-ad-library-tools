# GitHub Pages (classic Jekyll build, no Actions)
title: "Facebook 广告资料库工具"
description: "Facebook 广告资料库（Meta Ad Library）链接生成、解析与编号提取：CLI + 油猴脚本。"
lang: zh-CN
url: "https://zlaouaywhuyasdlaouaysh-ui.github.io"
baseurl: "/facebook-ad-library-tools"
repository: "zlaouaywhuyasdlaouaysh-ui/facebook-ad-library-tools"
author:
  name: "33.ci"
  url: "https://33.ci"
logo: "https://33.ci/icon-192.png"
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
markdown: kramdown
kramdown:
  input: GFM
exclude:
  - LICENSE
  - package.json
  - test/
  - node_modules/
defaults:
  - scope: {path: ""}
    values: {layout: default}
  - scope: {path: "README.md"}
    values: {title: "Facebook 广告资料库链接生成、解析与编号提取工具", description: "Facebook 广告资料库（Meta Ad Library）链接参数速查表，命令行和油猴脚本：生成搜索链接、解析链接、批量提取广告编号和主页编号。开源免费。", alt_en: "README.en.html"}
  - scope: {path: "README.en.md"}
    values: {title: "Facebook Ad Library URL Builder, Parser and ID Extractor", description: "Facebook Ad Library (Meta Ad Library) URL parameters reference, CLI and userscript: build and parse URLs, extract Library IDs and Page IDs. Free and open source.", lang: en, alt_zh: "./"}
